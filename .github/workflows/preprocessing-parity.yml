name: Preprocessing parity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  preprocessing-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install offline contract test dependencies
        run: |
          python -m pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.23.5 soundfile==0.12.1 PyYAML==6.0.3 typing_extensions==4.16.0 -r requirements-dev.txt -r requirements-audio.txt -r requirements-service.txt
      - name: Gate service and preprocessing parity (no weights or downloads)
        run: python -m pytest tests/audio tests/service -q
