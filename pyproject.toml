[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxsentinel"
version = "0.1.0"
description = "VoxSentinel model-training foundation"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
